services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: autoclip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 主应用服务
  autoclip:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoclip:local
    container_name: autoclip-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOCLIP_YT_SUBTITLE_LANGS=${AUTOCLIP_YT_SUBTITLE_LANGS:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serve the production frontend and proxy API requests to FastAPI.
  frontend:
    image: nginx:1.27-alpine
    container_name: autoclip-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      autoclip:
        condition: service_healthy
      frontend-assets:
        condition: service_completed_successfully

  # Populate the shared frontend volume from the application image built above.
  frontend-assets:
    image: autoclip:local
    container_name: autoclip-frontend-assets
    restart: "no"
    user: "0:0"
    volumes:
      - frontend_dist:/frontend-dist
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -rf /frontend-dist/* && cp -a /app/frontend/dist/. /frontend-dist/ && chmod -R a+rX /frontend-dist"]
    depends_on:
      autoclip:
        condition: service_started

  # Celery Worker服务
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoclip:local
    container_name: autoclip-celery-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=${LLM_PROVIDER:-dashscope}
      - API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}
      - API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}
      - API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}
      - API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}
      - AUTOCLIP_YT_SUBTITLE_LANGS=${AUTOCLIP_YT_SUBTITLE_LANGS:-}
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=2 -Q celery,processing,video,notification,upload
    depends_on:
      redis:
        condition: service_healthy
      autoclip:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoclip:local
    container_name: autoclip-celery-beat
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    command: celery -A backend.core.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      autoclip:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoclip:local
    container_name: autoclip-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=production
    command: celery -A backend.core.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  redis_data:
    driver: local
  frontend_dist:

networks:
  default:
    name: autoclip-network
